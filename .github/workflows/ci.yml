name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the checkout. Without an explicit
# block the job would inherit the repository default, which can be write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run biome

      - name: Typecheck
        run: npm run typecheck

      # A cart carries its owner, and the rules deciding whether one is kept,
      # handed over or let go are the kind that fail quietly: the cart simply
      # belongs to the wrong person, or vanishes after a Shopify hiccup. These
      # run offline against the pure half of that logic.
      - name: Cart ownership rules
        run: npm run cart:ownership-check

      # The optimistic overlay is dropped once the server has applied it, and
      # getting that wrong is invisible to every other check: the cart simply
      # counts a pending line twice for a second. These drive the real
      # Hydrogen hook over scripted fetcher states and assert the raw hook
      # still doubles, so the guard cannot quietly stop guarding.
      - name: Cart overlay rules
        run: npm run cart:overlay-check

      # Typecheck does not see bundler-level breakage: a bad dynamic import, a
      # client-only module pulled into the worker bundle, or a Vite plugin
      # misconfiguration all typecheck clean and fail at deploy. The build
      # needs no storefront credentials, so it runs unauthenticated here.
      - name: Build
        run: npm run build
